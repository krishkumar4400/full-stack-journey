
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
  </head>
  <body>
    <main>
      <section>
        <div class="all-reels">
          <div class="reel">
            <video class="main-img" autoplay loop muted src="./reels/1.mp4"></video>
            <div class="bottom">
              <div class="user">
                <img class="avatar" src="https://images.unsplash.com/photo-1611042553365-9b101441c135?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8ODB8fGZhc2hpb24lMjBtb2RlbHxlbnwwfHwwfHx8MA%3D%3D" alt="">
                <h4>krish.kumar</h4>
                <button>Follow</button>
              </div>
              <div>
                <p class="caption">Lorem ipsum dolor sit amet.</p>
              </div>
            </div>
            <div class="right">
              <i class="ri-heart-line"></i>
              <span>Like</span>
              <i class="ri-chat-1-line"></i>
              <span>Comment</span>
              <i class="ri-share-forward-line"></i>
              <span>Share</span>
              <img class="save-icon" src="image.png" alt="">
              <span>Save</span>
              <img class="save-icon" src="dots.png" alt="">
            </div>
          </div>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
